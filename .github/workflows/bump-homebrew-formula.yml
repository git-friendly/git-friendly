name: Publish Homebrew formula

on:
  push:
    branches: [main]
    paths: ["Formula/**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (leave empty to sync the current formula)
        required: false

permissions:
  contents: write

concurrency:
  group: publish-homebrew
  cancel-in-progress: false

jobs:
  homebrew:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Check out the formula source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check out the published tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: git-friendly/homebrew-git-friendly
          ref: main
          path: .homebrew-tap
          token: ${{ secrets.COMMITTER_TOKEN }}

      - name: Update release metadata
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ -n "$TAG" ]]; then
            url="https://github.com/git-friendly/git-friendly/archive/refs/tags/${TAG}.tar.gz"
            sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
            ruby -e '
              path, url, sha = ARGV
              formula = File.read(path)
              formula.sub!(/^  url .*/, "  url #{url.dump}")
              formula.sub!(/^  sha256 .*/, "  sha256 #{sha.dump}")
              File.write(path, formula)
            ' Formula/git-friendly.rb "$url" "$sha"
          fi

      - name: Publish formula to both repositories
        run: |
          cp Formula/git-friendly.rb .homebrew-tap/Formula/git-friendly.rb
          cp Formula/README.md .homebrew-tap/README.md
          git -C .homebrew-tap add README.md
          for repo in . .homebrew-tap; do
            git -C "$repo" config user.name "github-actions[bot]"
            git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$repo" add Formula/git-friendly.rb
            if ! git -C "$repo" diff --cached --quiet; then
              git -C "$repo" commit --no-gpg-sign -m "Update the Homebrew formula"
              git -C "$repo" push origin HEAD:main
            fi
          done
